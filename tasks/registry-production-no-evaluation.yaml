prompt: |
  check() raises an exception on a manifest with maturity: production and no evaluation section,
  instead of reporting it. One broken manifest stops `registry validate` before it reports the
  problems in the other manifests.

  Expected behaviour of check():
  - A production (or validated) asset without an evaluation section returns a problem whose message
    is "validated requires an evaluation", and no exception escapes.
