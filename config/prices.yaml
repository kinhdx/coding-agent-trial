# USD per million tokens, from the providers' pricing pages on 2026-10-10:
#   https://docs.claude.com (Claude Sonnet 5.5), https://docs.x.ai/docs/models, https://api-docs.deepseek.com/quick_start/pricing
# DeepSeek charges a peak and an off-peak rate; the budget uses the peak rate so it never undercounts.
# cache_write applies only where the provider bills cache creation separately.
claude-sonnet-5-5:
  input: 2.0
  cache_read: 0.2
  cache_write: 2.5
  output: 10.0
claude-haiku-5-5:  # Claude Code uses it for small background calls; cache rates assumed at 0.1x and 1.25x of input
  input: 0.10
  cache_read: 0.01
  cache_write: 0.125
  output: 0.50
grok-build-0.1:
  input: 1.0
  cache_read: 0.2
  output: 2.0
  long_context: {above: 200000, input: 2.0, cache_read: 0.4, output: 4.0}
grok-4.6:  # Grok Build sends a few short requests to it besides the selected model
  input: 2.0
  cache_read: 0.5
  output: 6.0
  long_context: {above: 200000, input: 4.0, cache_read: 1.0, output: 12.0}
deepseek-v4-pro:
  input: 1.32
  cache_read: 0.044
  output: 3.96
deepseek-flash: &deepseek-flash
  input: 0.3
  cache_read: 0.006
  output: 1.2
deepseek-v4-flash: *deepseek-flash  # legacy name, still accepted and billed at the Flash price
