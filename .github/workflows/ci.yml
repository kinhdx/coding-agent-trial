name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validate:
        description: Build the sandbox image and check every task's hidden tests against its fix commit
        type: boolean
        default: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  validate-tasks:
    # Needs Docker and about twenty minutes, so it runs on request only.
    if: github.event_name == 'workflow_dispatch' && inputs.validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - run: uv run trial build --harness
      - run: uv run trial validate
      - working-directory: ts
        run: npm ci --no-audit --no-fund && npm run check:sandbox
